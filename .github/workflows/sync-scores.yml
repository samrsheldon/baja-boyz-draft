name: Sync WC scores

# Auto-syncs ESPN results into Firebase so scores stay current even when
# nobody has the app open. WC 2026 kickoffs run 16:00–04:00 UTC, so matches
# finish ~18:00–06:00 UTC. Sync hourly across that window and skip the
# match-free daytime (07:00–17:00 UTC). Hourly cadence keeps gaps small even
# when GitHub delays or drops scheduled runs (it's best-effort).
on:
  schedule:
    - cron: "0 18,19,20,21,22,23,0,1,2,3,4,5,6 * * *"
  workflow_dispatch: {}

# Avoid overlapping runs if one is slow
concurrency:
  group: sync-scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync scores from ESPN to Firebase
        run: python3 sync_scores.py
