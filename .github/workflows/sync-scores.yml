name: Sync WC scores

# Auto-syncs ESPN results into Firebase so scores stay current even when
# nobody has the app open. WC 2026 kickoffs run 16:00–04:00 UTC, so matches
# finish ~18:00–06:00 UTC. Sync every 2h across that window (catches each
# full-time within ~2h) and skip the match-free daytime (06:00–16:00 UTC).
on:
  schedule:
    - cron: "0 18,20,22,0,2,4,6 * * *"
  workflow_dispatch: {}

# Avoid overlapping runs if one is slow
concurrency:
  group: sync-scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync scores from ESPN to Firebase
        run: python3 sync_scores.py
