    // ─── SETUP SCREEN ─────────────────────────────────────────────────────────

    function SetupScreen({ onStart }) {

      const [aiIdx, setAiIdx]      = useState(null);

      const allFilled = players.every(p => p.trim());

      function setPlayer(i, val) {
        const next = [...players]; next[i] = val; setPlayers(next);
      }

      function handleStart() {
        const order = randomize ? shuffle([0,1,2,3,4,5,6,7]) : [0,1,2,3,4,5,6,7];
        onStart(players.map(p => p.trim()), order, aiIdx);
      }

    // ─── DRAFT SCREEN ─────────────────────────────────────────────────────────

    function DraftScreen({ state, onPick, onUndo, onShare }) {
      const { players, draftOrder } = state;
      const [confFilter, setConf] = useState('All');
      // Firebase strips trailing nulls — always rebuild the full 48-slot array
      const picks = (() => {
        const raw = state.picks;
        const arr = Array(48).fill(null);
        if (!raw) return arr;
        if (Array.isArray(raw)) raw.forEach((v, i) => { if (i < 48 && v) arr[i] = v; });
        else Object.entries(raw).forEach(([k, v]) => { if (v) arr[parseInt(k)] = v; });
        return arr;
      })();

      const currentPickIdx   = picks.findIndex(p => p === null);
      const draftDone        = currentPickIdx === -1;
      const currentPlayerIdx = draftDone ? null : pickToPlayer(currentPickIdx, draftOrder);
      const currentPlayer    = currentPlayerIdx !== null ? players[currentPlayerIdx] : null;

      const lastPickIdx = picks.map((p, i) => p !== null ? i : -1).filter(i => i >= 0).slice(-1)[0] ?? -1;

      const pickedByName = useMemo(() => {
        const m = {};
        picks.forEach((teamId, idx) => {
          if (teamId) m[teamId] = players[pickToPlayer(idx, draftOrder)];
        });
        return m;
      }, [picks, draftOrder, players]);

      const confs = ['All', 'UEFA', 'CONMEBOL', 'CONCACAF', 'CAF', 'AFC', 'OFC', 'Playoff'];
      const displayTeams = (confFilter === 'All' ? TEAMS : TEAMS.filter(t => t.conf === confFilter))

      return (

              ) : (() => {

                        {isAI ? '🤖 Claudinho thinking…' : 'On the Clock'}
                      </div>
                      <div className="text-white font-bold text-sm mt-0.5 truncate">{currentPlayer}</div>
                      <div className="text-gray-400 text-xs">Pick {currentPickIdx + 1} · R{Math.floor(currentPickIdx / 8) + 1}</div>

                  );

                    return (
                      <div
                        key={pIdx}
                        className={`flex items-center gap-1.5 px-1.5 py-0.5 rounded text-xs ${isCurr ? 'bg-green-900/50 text-green-200' : 'text-gray-500'}`}

                        <span className="w-5 text-right text-gray-700 flex-shrink-0">{pIdx + 1}.</span>

    // Shared ESPN score sync — fetches every team's WC schedule, computes group
    // points + furthest round, and returns merged scores. Used by both the
    // Scoring screen and the Settings manual-sync button.
    async function fetchESPNScores(currentScores) {
      const teamsToFetch = TEAMS.filter(t => t.espnId);
      const fetched = await Promise.allSettled(
        teamsToFetch.map(t =>
          fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams/${t.espnId}/schedule`)
            .then(r => r.json())
            .then(data => ({ team: t, events: data.events || [] }))
        )
      );

      const newScores = { ...currentScores };
      let updated = 0;
      const roundOf = e => ESPN_ROUND_NAME_TO_ROUND[(e.seasonType?.name || '').toLowerCase()] || null;

      for (const result of fetched) {
        if (result.status !== 'fulfilled') continue;
        const { team, events } = result.value;
        const eid = String(team.espnId);

        const completed = events.filter(e =>
          e.competitions?.[0]?.status?.type?.completed === true ||
          e.competitions?.[0]?.status?.type?.state === 'post'
        );
        if (completed.length === 0) continue;

        // Group stage points (3 win / 1 draw)
        const groupMatches = completed.filter(e => roundOf(e) === 'Eliminated (Group Stage)');
        let groupPoints = 0;
        for (const e of groupMatches) {
          const comps = e.competitions?.[0]?.competitors || [];
          const us   = comps.find(c => String(c.team?.id) === eid || String(c.id) === eid);
          const them = comps.find(c => String(c.team?.id) !== eid && String(c.id) !== eid);
          if (!us) continue;
          const ourScore   = parseInt(us?.score?.displayValue   ?? us?.score?.value   ?? 0);
          const theirScore = parseInt(them?.score?.displayValue  ?? them?.score?.value  ?? 0);
          if (ourScore > theirScore)      groupPoints += 3;
          else if (ourScore === theirScore) groupPoints += 1;
        }

        // Furthest round reached = deepest knockout match they appear in
        let roundReached = 'Eliminated (Group Stage)';
        let deepest = null;
        for (const e of completed) {
          const r = roundOf(e);
          if (!r || r === 'Eliminated (Group Stage)') continue;
          if (deepest === null || ROUND_ORDER[r] > ROUND_ORDER[deepest]) deepest = r;
        }
        if (deepest) {
          roundReached = deepest;
          // If they won the Final, they're the Champion (else Runner-up)
          const finalMatch = completed.find(e => roundOf(e) === 'Runner-up');
          if (finalMatch) {
            const comps = finalMatch.competitions?.[0]?.competitors || [];
            const us = comps.find(c => String(c.team?.id) === eid || String(c.id) === eid);
            if (us?.winner || us?.score?.winner) roundReached = 'Champion';
          }
        }

        newScores[team.id] = { groupPoints, roundReached };
        updated++;
      }

      return { newScores, updated };
    }

    // WMO weather code → { emoji, label }
    function wmoWeather(code) {
      if (code === 0) return { emoji: '☀️', label: 'Clear' };
      if (code === 1) return { emoji: '🌤️', label: 'Mainly clear' };
      if (code === 2) return { emoji: '⛅', label: 'Partly cloudy' };
      if (code === 3) return { emoji: '☁️', label: 'Overcast' };
      if (code === 45 || code === 48) return { emoji: '🌫️', label: 'Fog' };
      if (code >= 51 && code <= 57) return { emoji: '🌦️', label: 'Drizzle' };
      if (code >= 61 && code <= 67) return { emoji: '🌧️', label: 'Rain' };
      if (code >= 71 && code <= 77) return { emoji: '🌨️', label: 'Snow' };
      if (code >= 80 && code <= 82) return { emoji: '🌦️', label: 'Showers' };
      if (code === 85 || code === 86) return { emoji: '🌨️', label: 'Snow showers' };
      if (code >= 95) return { emoji: '⛈️', label: 'Thunderstorm' };
      return { emoji: '🌡️', label: '' };
    }

        picks.forEach((teamId, idx) => {
          if (teamId) m[teamId] = players[pickToPlayer(idx, draftOrder)];
        });
        return m;
      }, [picks, draftOrder, players]);

      React.useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoading(true); setError('');
          try {
            // Build a rolling 16-day window of dates from today (YYYYMMDD)
            const dates = [];
            const start = new Date();
            for (let i = 0; i < 16; i++) {
              const d = new Date(start.getTime() + i * 86400000);
              dates.push(`${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`);
            }
            const results = await Promise.allSettled(
              dates.map(dt =>
                fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${dt}`)
                  .then(r => r.json())
              )
            );
            const events = [];
            for (const res of results) {
              if (res.status !== 'fulfilled') continue;
              for (const e of (res.value?.events || [])) {
                const st = e.competitions?.[0]?.status?.type;
                // Upcoming or live only — skip finished matches
                if (st?.state === 'post' || st?.completed) continue;
                const comps = e.competitions?.[0]?.competitors || [];
                const home = comps.find(c => c.homeAway === 'home') || comps[0];
                const away = comps.find(c => c.homeAway === 'away') || comps[1];
                const venue = e.competitions?.[0]?.venue || e.venue || {};
                events.push({
                  id: e.id,
                  date: new Date(e.date),
                  state: st?.state,
                  detail: st?.shortDetail,
                  round: e.seasonType?.name || '',
                  home, away,
                  homeScore: home?.score?.displayValue ?? home?.score?.value,
                  awayScore: away?.score?.displayValue ?? away?.score?.value,
                  venueName: venue.fullName || '',
                  city: venue.address?.city || '',
                  country: venue.address?.country || '',
                });
              }
            }
            // De-dupe by event id, sort by kickoff
            const seen = new Set();
            const deduped = events.filter(e => (seen.has(e.id) ? false : seen.add(e.id)));
            deduped.sort((a, b) => a.date - b.date);
            if (!cancelled) setFixtures(deduped);
          } catch (err) {
            if (!cancelled) setError(err.message || 'Failed to load fixtures');
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, []);

      // Fetch day-of-match forecasts (Open-Meteo, free/no-key) once fixtures load.
      // One request per unique venue covers all of that venue's fixtures.
      React.useEffect(() => {
        if (!fixtures || fixtures.length === 0) return;
        let cancelled = false;
        (async () => {
          const venues = [...new Set(fixtures.map(f => f.venueName).filter(v => VENUE_COORDS[v]))];
          const entries = await Promise.allSettled(venues.map(async name => {
            const { lat, lon } = VENUE_COORDS[name];
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
              + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`
              + `&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`;
            const d = await fetch(url).then(r => r.json());
            const days = {};
            (d.daily?.time || []).forEach((date, i) => {
              days[date] = {
                code:   d.daily.weather_code?.[i],
                hi:     Math.round(d.daily.temperature_2m_max?.[i]),
                lo:     Math.round(d.daily.temperature_2m_min?.[i]),
                precip: d.daily.precipitation_probability_max?.[i],
              };
            });
            return [name, { offset: d.utc_offset_seconds || 0, days }];
          }));
          if (cancelled) return;
          const next = {};
          for (const e of entries) if (e.status === 'fulfilled') next[e.value[0]] = e.value[1];
          setWeather(next);
        })();
        return () => { cancelled = true; };
      }, [fixtures]);

      // Look up a fixture's forecast for its venue-local match day
      function fixtureWeather(f) {
        const w = weather[f.venueName];
        if (!w) return null;
        const localDate = new Date(f.date.getTime() + w.offset * 1000).toISOString().slice(0, 10);
        return w.days[localDate] || null;
      }

      function teamCell(comp, score, align) {
        const espnId = String(comp?.team?.id ?? comp?.id ?? '');
        const team = TEAM_BY_ESPN[espnId];
        const flag = team?.flag || '';
        const name = team?.name || comp?.team?.shortDisplayName || comp?.team?.displayName || 'TBD';
        const owner = team ? ownerByTeamId[team.id] : null;
        return (
          <div className={`flex-1 min-w-0 flex items-center gap-2 ${align === 'right' ? 'flex-row-reverse text-right' : ''}`}>
            <span className="text-2xl flex-shrink-0">{flag}</span>
            <div className="min-w-0">
              <div className="font-bold text-white text-sm truncate">{name}</div>
              {owner && <div className="text-[11px] text-green-400 truncate">{owner}</div>}
            </div>
          </div>
        );
      }

      // Group fixtures by local calendar day
      const groups = [];
      if (fixtures) {
        const byDay = {};
        for (const f of fixtures) {
          const key = f.date.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });
          (byDay[key] = byDay[key] || []).push(f);
        }
        for (const f of fixtures) {
          const key = f.date.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric' });
          if (!groups.find(g => g.key === key)) groups.push({ key, items: byDay[key] });
        }
      }

      const tz = (() => {
        try { return new Intl.DateTimeFormat('en', { timeZoneName: 'short' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName')?.value || ''; }
        catch { return ''; }
      })();

      return (
        <div className="p-4 md:p-6 max-w-2xl mx-auto">
          <div className="flex items-baseline justify-between mb-5">
            <h2 className="text-xl font-black text-white">Upcoming Fixtures</h2>
            {tz && <span className="text-xs text-gray-500">times shown in {tz}</span>}
          </div>

          {loading && <p className="text-gray-500 text-sm">Loading fixtures from ESPN…</p>}
          {error && <p className="text-red-400 text-sm">Error: {error}</p>}
          {!loading && !error && fixtures && fixtures.length === 0 && (
            <p className="text-gray-500 text-sm">No upcoming matches in the next 16 days.</p>
          )}

          <div className="space-y-6">
            {groups.map(({ key, items }) => (
              <div key={key}>
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">{key}</h3>
                <div className="space-y-2">
                  {items.map(f => {
                    const live = f.state === 'in';
                    return (
                      <div key={f.id} className="bg-gray-800 border border-gray-700 rounded-xl px-3 py-3">
                        <div className="flex items-center gap-2">
                          {teamCell(f.home, f.homeScore, 'left')}
                          <div className="flex-shrink-0 text-center px-1 min-w-[64px]">
                            {live ? (
                              <>
                                <div className="text-base font-black text-white">{f.homeScore ?? 0}–{f.awayScore ?? 0}</div>
                                <div className="text-[10px] font-bold text-red-400 animate-pulse">● {f.detail || 'LIVE'}</div>
                              </>
                            ) : (
                              <>
                                <div className="text-sm font-black text-white">{f.date.toLocaleTimeString('en', { hour: 'numeric', minute: '2-digit' })}</div>
                                <div className="text-[10px] text-gray-500">vs</div>
                              </>
                            )}
                          </div>
                          {teamCell(f.away, f.awayScore, 'right')}
                        </div>
                        {f.round && f.round !== 'Group Stage' && (
                          <div className="text-center text-[10px] text-gray-500 mt-1.5 uppercase tracking-wide">{f.round}</div>
                        )}
                        {(f.venueName || fixtureWeather(f)) && (
                          <div className="mt-2 pt-2 border-t border-gray-700/60 flex items-center justify-between gap-2">
                            <div className="min-w-0 text-[11px] truncate">
                              {f.venueName && <span className="text-gray-300">📍 {f.venueName}</span>}
                              {f.city && <span className="text-gray-500"> · {f.city}{f.country ? `, ${f.country}` : ''}</span>}
                            </div>
                            {(() => {
                              const wx = fixtureWeather(f);
                              if (!wx || wx.hi == null) return null;
                              const { emoji, label } = wmoWeather(wx.code);
                              return (
                                <div className="flex-shrink-0 flex items-center gap-1 text-[11px] text-gray-300" title={label}>
                                  <span className="text-sm">{emoji}</span>
                                  <span className="font-semibold">{wx.hi}°</span>
                                  <span className="text-gray-500">/{wx.lo}°</span>
                                  {wx.precip != null && wx.precip >= 30 && <span className="text-blue-400">💧{wx.precip}%</span>}
                                </div>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

      const pickedByName = useMemo(() => {

        return m;

    function RankingsScreen({ state }) {
      const [filter, setFilter]   = React.useState('All');
      const [expanded, setExpanded] = React.useState(null);
      const [espnCache, setCache] = React.useState({});
      const [loading, setLoading] = React.useState({});

      const pickedByName = React.useMemo(() => {
        const m = {};
        state.picks.forEach((teamId, idx) => {
          if (teamId) m[teamId] = state.players[pickToPlayer(idx, state.draftOrder)];
        });
        return m;
      }, [state.picks, state.draftOrder, state.players]);

      async function fetchTeam(team) {
        if (!team.espnId || espnCache[team.id]) return;
        setLoading(l => ({ ...l, [team.id]: true }));
        try {
          const [schedRes, newsRes] = await Promise.allSettled([
            fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/${team.espnId}/schedule`).then(r => r.json()),
            fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/news?team=${team.espnId}&limit=10`).then(r => r.json()),
          ]);

          // Recent results + upcoming
          let results = [], upcoming = [];
          if (schedRes.status === 'fulfilled' && Array.isArray(schedRes.value?.events)) {
            const espnId = String(team.espnId);
            const events = schedRes.value.events;

            const getScore = c => parseInt(c?.score?.displayValue ?? c?.score?.value ?? c?.score ?? 0);
            const getStatus = e => e.competitions?.[0]?.status?.type;

            results = events
              .filter(e => getStatus(e)?.completed === true || getStatus(e)?.state === 'post')
              .slice(-8).reverse().slice(0, 5)
              .map(e => {
                const comps = e.competitions?.[0]?.competitors || [];
                const us   = comps.find(c => String(c.team?.id) === espnId || String(c.id) === espnId) || comps[0];
                const them = comps.find(c => String(c.team?.id) !== espnId && String(c.id) !== espnId) || comps[1];
                const ourScore   = getScore(us);
                const theirScore = getScore(them);
                const result = us?.winner ? 'W' : ourScore === theirScore ? 'D' : 'L';
                const league = e.competitions?.[0]?.league?.shortName || e.competitions?.[0]?.league?.name || '';
                return {
                  result, score: `${ourScore}–${theirScore}`,
                  opponent: them?.team?.shortDisplayName || them?.team?.displayName || them?.team?.name || '?',
                  competition: league.replace('International Friendly', 'Friendly'),
                  date: new Date(e.date).toLocaleDateString('en', { month: 'short', day: 'numeric', year: '2-digit' }),
                };
              });

            upcoming = events
              .filter(e => getStatus(e)?.state === 'pre')
              .slice(0, 3)
              .map(e => {
                const comps = e.competitions?.[0]?.competitors || [];
                const us   = comps.find(c => String(c.team?.id) === espnId || String(c.id) === espnId) || comps[0];
                const them = comps.find(c => String(c.team?.id) !== espnId && String(c.id) !== espnId) || comps[1];
                const d = new Date(e.date);
                const league = e.competitions?.[0]?.league?.shortName || e.competitions?.[0]?.league?.name || '';
                return {
                  opponent: them?.team?.shortDisplayName || them?.team?.displayName || them?.team?.name || '?',
                  isHome: us?.homeAway === 'home',
                  competition: league.replace('International Friendly', 'Friendly'),
                  date: d.toLocaleDateString('en', { month: 'short', day: 'numeric' }),
                  time: d.toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' }),
                };
              });
          }

          // News headlines
          let articles = [];
          if (newsRes.status === 'fulfilled' && newsRes.value?.articles) {
            articles = newsRes.value.articles.slice(0, 6).map(a => ({
              headline: a.headline || a.title || '',
              url: a.links?.web?.href || '#',
              date: a.published ? new Date(a.published).toLocaleDateString('en', { month: 'short', day: 'numeric' }) : '',
            }));
          }

          setCache(c => ({ ...c, [team.id]: { results, upcoming, articles } }));
        } catch {}
        setLoading(l => ({ ...l, [team.id]: false }));
      }

      function handleExpand(team) {
        const next = expanded === team.id ? null : team.id;
        setExpanded(next);
        if (next) fetchTeam(team);
      }

      const filters  = ['All', 'A','B','C','D','E','F','G','H','I','J','K','L'];
      const sorted   = [...TEAMS]
        .filter(t => filter === 'All' || t.group === filter)
        .sort((a, b) => (a.rank || 999) - (b.rank || 999));

      const resultColor = { W: 'bg-green-900/60 text-green-300', D: 'bg-yellow-900/60 text-yellow-300', L: 'bg-red-900/60 text-red-300' };

      return (
        <div className="p-4 md:p-6 max-w-3xl mx-auto">
          <div className="flex items-center justify-between mb-1">
            <h2 className="text-xl font-black text-white">FIFA Rankings</h2>
            <a href="https://inside.fifa.com/fifa-world-ranking/men" target="_blank" rel="noopener"
               className="text-xs text-gray-500 hover:text-green-400 transition-colors underline">

    // ─── TEAM DETAIL MODAL ────────────────────────────────────────────────────

    function TeamDetailModal({ team, drafter, onClose }) {
      const [data, setData]     = React.useState(null);
      const [isLoad, setLoad]   = React.useState(false);
      const resultColor = { W: 'bg-green-900/60 text-green-300', D: 'bg-yellow-900/60 text-yellow-300', L: 'bg-red-900/60 text-red-300' };

      React.useEffect(() => {
        if (!team.espnId) return;
        let cancelled = false;
        async function load() {
          setLoad(true);
          try {
            const [schedRes, newsRes] = await Promise.allSettled([
              fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/${team.espnId}/schedule`).then(r => r.json()),
              fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/news?team=${team.espnId}&limit=10`).then(r => r.json()),
            ]);

            let results = [], upcoming = [];
            if (schedRes.status === 'fulfilled' && Array.isArray(schedRes.value?.events)) {
              const espnId = String(team.espnId);
              const events = schedRes.value.events;

              const getScore = c => parseInt(c?.score?.displayValue ?? c?.score?.value ?? c?.score ?? 0);
              const getStatus = e => e.competitions?.[0]?.status?.type;

              const mapResult = e => {
                const comps = e.competitions?.[0]?.competitors || [];
                const us   = comps.find(c => String(c.team?.id) === espnId || String(c.id) === espnId) || comps[0];
                const them = comps.find(c => String(c.team?.id) !== espnId && String(c.id) !== espnId) || comps[1];
                const ourScore   = getScore(us);
                const theirScore = getScore(them);
                const result = us?.winner ? 'W' : ourScore === theirScore ? 'D' : 'L';
                const league = e.competitions?.[0]?.league?.shortName || e.competitions?.[0]?.league?.name || '';
                return {
                  result, score: `${ourScore}–${theirScore}`,
                  opponent: them?.team?.shortDisplayName || them?.team?.displayName || them?.team?.name || '?',
                  competition: league.replace('International Friendly', 'Friendly'),
                  date: new Date(e.date).toLocaleDateString('en', { month: 'short', day: 'numeric', year: '2-digit' }),
                };
              };

              const mapUpcoming = e => {
                const comps = e.competitions?.[0]?.competitors || [];
                const us   = comps.find(c => String(c.team?.id) === espnId || String(c.id) === espnId) || comps[0];
                const them = comps.find(c => String(c.team?.id) !== espnId && String(c.id) !== espnId) || comps[1];
                const d = new Date(e.date);
                const league = e.competitions?.[0]?.league?.shortName || e.competitions?.[0]?.league?.name || '';
                return {
                  opponent: them?.team?.shortDisplayName || them?.team?.displayName || them?.team?.name || '?',
                  isHome: us?.homeAway === 'home',
                  competition: league.replace('International Friendly', 'Friendly'),
                  date: d.toLocaleDateString('en', { month: 'short', day: 'numeric' }),
                  time: d.toLocaleTimeString('en', { hour: '2-digit', minute: '2-digit' }),
                };
              };

              results  = events.filter(e => getStatus(e)?.completed === true || getStatus(e)?.state === 'post')
                               .slice(-8).reverse().slice(0, 5).map(mapResult);
              upcoming = events.filter(e => getStatus(e)?.state === 'pre')
                               .slice(0, 3).map(mapUpcoming);
            }

            let articles = [];
            if (newsRes.status === 'fulfilled' && Array.isArray(newsRes.value?.articles)) {
              articles = newsRes.value.articles.slice(0, 6).map(a => ({
                headline: a.headline || a.title || '',
                url: a.links?.web?.href || '#',
                date: a.published ? new Date(a.published).toLocaleDateString('en', { month: 'short', day: 'numeric' }) : '',
              }));
            }

            if (!cancelled) setData({ results, upcoming, articles });
          } catch(err) {
            console.warn('TeamDetailModal fetch error:', err);
            if (!cancelled) setData({ results: [], articles: [] });
          } finally {
            if (!cancelled) setLoad(false);
          }
        }
        load();
        return () => { cancelled = true; };
      }, [team.id]);

      return (
        <div className="fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" onClick={onClose}>
          <div
            className="bg-gray-800 border border-gray-700 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[85vh] overflow-y-auto shadow-2xl"
            onClick={e => e.stopPropagation()}
          >
            {/* Header */}
            <div className="flex items-center gap-3 px-4 py-3 border-b border-gray-700 sticky top-0 bg-gray-800 z-10">
              <span className="text-3xl">{team.flag}</span>
              <div className="flex-1 min-w-0">
                <div className="font-black text-white text-base leading-tight">{team.name}</div>
                <div className="text-xs text-gray-500">
                  Group {team.group} · <span className={CONF_COLORS[team.conf]}>{team.conf}</span>
                  {team.rank && <span> · #{team.rank} FIFA</span>}
                  {drafter && <span className="text-green-500 ml-1">· {drafter}</span>}
                </div>
              </div>
              <button onClick={onClose} className="text-gray-500 hover:text-white text-xl leading-none flex-shrink-0">✕</button>
            </div>

            {/* Body */}
            <div className="px-4 py-3">
              {!team.espnId ? (
                <p className="text-gray-600 text-xs text-center py-6">No ESPN data available for this team.</p>
              ) : isLoad ? (
                <p className="text-gray-500 text-xs text-center animate-pulse py-6">Loading ESPN data…</p>
              ) : !data ? (
                <p className="text-gray-600 text-xs text-center py-6">No data yet.</p>
              ) : (
                <div className="space-y-4">
                  {/* Recent results */}
                  <div>
                    <div className="text-xs text-gray-400 uppercase tracking-widest mb-2">Recent Results</div>
                    {data.results.length === 0 ? (
                      <p className="text-gray-600 text-xs">No recent results found.</p>
                    ) : (
                      <div className="space-y-1.5">
                        {data.results.map((r, i) => (
                          <div key={i} className="flex items-center gap-2 text-xs">
                            <span className={`font-black px-1.5 py-0.5 rounded text-xs flex-shrink-0 ${resultColor[r.result]}`}>{r.result}</span>
                            <span className="text-white font-semibold w-8 flex-shrink-0">{r.score}</span>
                            <span className="text-gray-300 truncate flex-1">vs {r.opponent}</span>
                            <span className="text-gray-600 flex-shrink-0">{r.date}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  {/* Upcoming */}
                  {data.upcoming && data.upcoming.length > 0 && (
                    <div>
                      <div className="text-xs text-gray-400 uppercase tracking-widest mb-2">Upcoming Fixtures</div>
                      <div className="space-y-1.5">
                        {data.upcoming.map((u, i) => (
                          <div key={i} className="flex items-center gap-2 text-xs">
                            <span className="text-blue-400 font-bold flex-shrink-0 w-8">{u.isHome ? 'H' : 'A'}</span>
                            <span className="text-gray-200 truncate flex-1">vs {u.opponent}</span>
                            {u.competition && <span className="text-gray-600 truncate max-w-[80px]">{u.competition}</span>}
                            <span className="text-gray-500 flex-shrink-0">{u.date}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {/* News */}
                  <div>
                    <div className="text-xs text-gray-400 uppercase tracking-widest mb-2">Latest News</div>
                    {data.articles.length === 0 ? (
                      <p className="text-gray-600 text-xs">No news available.</p>
                    ) : (
                      <div className="space-y-2">
                        {data.articles.map((a, i) => (
                          <a key={i} href={a.url} target="_blank" rel="noopener"
                             className="block text-xs text-blue-400 hover:text-blue-300 transition-colors leading-snug">
                            {a.headline}
                            {a.date && <span className="text-gray-600 ml-1">· {a.date}</span>}
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function InviteModal({ url, players, onClose }) {
      const [copied, setCopied] = React.useState(false);
      const [msgCopied, setMsgCopied] = React.useState(false);

      function buildMsg() {
        const soccer  = String.fromCodePoint(0x26BD);
        const point   = String.fromCodePoint(0x1F447);
        const names = players.join(', ');
        return `${soccer} Baja Boyz WC 2026 Challenge is live!\n\nPlayers: ${names}\n\nOpen the link to follow the draft live:\n${point}\n${url}`;
      }

      function sendToWhatsApp() {
        const msg = buildMsg();
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
        } else {
          navigator.clipboard.writeText(msg).then(() => {
            setMsgCopied(true);
            setTimeout(() => setMsgCopied(false), 3000);
          }).catch(() => prompt('Copy and paste into WhatsApp:', msg));
        }
      }

      function copyLink() {
        navigator.clipboard.writeText(url).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }).catch(() => prompt('Copy this link:', url));
      }

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">

            </div>

            <div className="bg-gray-900 rounded-xl p-3 mb-4 break-all text-xs text-gray-400 border border-gray-700 select-all">

            <button
              onClick={sendToWhatsApp}
              className="w-full bg-[#25D366] hover:bg-[#1ebe57] text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-colors mb-2"
            >
              <span className="text-lg">📲</span>
              {msgCopied ? '✓ Message copied — paste into WhatsApp!' : 'Send in WhatsApp'}

            <button
              onClick={copyLink}
              className="w-full bg-gray-700 hover:bg-gray-600 text-white py-2.5 rounded-xl text-sm transition-colors mb-3"
            >
              {copied ? '✓ Copied!' : 'Copy link'}

    // ─── SETTINGS SCREEN ─────────────────────────────────────────────────────

    function SettingsScreen({ autoFilled, scores, onBulkUpdate }) {
      const [now, setNow] = React.useState(Date.now());
      React.useEffect(() => {
        const t = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(t);
      }, []);

      const [syncing, setSyncing] = React.useState(false);
      const [syncMsg, setSyncMsg] = React.useState('');
      async function syncFromESPN() {
        setSyncing(true);
        setSyncMsg('');
        try {
          const { newScores, updated } = await fetchESPNScores(scores || {});
          onBulkUpdate(newScores);
          setSyncMsg(`✓ ${updated} team${updated !== 1 ? 's' : ''} updated from ESPN`);
        } catch (err) {
          setSyncMsg(`Error: ${err.message}`);
          console.error(err);
        } finally {
          setSyncing(false);
        }
      }

      const deadline = DRAFT_DEADLINE.getTime();
      const msLeft   = deadline - now;
      const isPast   = msLeft <= 0;

      function formatCountdown(ms) {
        if (ms <= 0) return null;
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        return `${h}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
      }

      return (
        <div className="p-4 max-w-lg mx-auto space-y-6">

          {/* Manual score sync */}
          <div>
            <h2 className="text-white font-black text-lg mb-1">Scores</h2>
            <p className="text-gray-500 text-xs mb-3">
              Scores auto-sync from ESPN every ~2 hours. Use this to pull the latest results right now.
            </p>
            <div className="flex items-center gap-3">
              <button
                onClick={syncFromESPN}
                disabled={syncing}
                className="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 disabled:bg-gray-700 disabled:text-gray-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition-colors"
              >
                {syncing
                  ? <><span className="animate-spin inline-block">⟳</span> Syncing…</>
                  : <>⚡ Sync from ESPN</>}
              </button>
              {syncMsg && (
                <span className={`text-xs ${syncMsg.startsWith('✓') ? 'text-green-400' : 'text-red-400'}`}>{syncMsg}</span>
              )}
            </div>
          </div>

          {/* Auto-fill deadline */}
          <div>
            <h2 className="text-white font-black text-lg mb-1">Auto-fill Deadline</h2>
            <p className="text-gray-500 text-xs mb-3">
              Any unpicked slots will be auto-filled with the best available team by FIFA ranking the moment the first match kicks off.
            </p>
            <div className={`rounded-xl px-4 py-3 border ${autoFilled ? 'bg-green-900/30 border-green-700' : isPast ? 'bg-yellow-900/30 border-yellow-700' : 'bg-gray-900 border-gray-800'}`}>
              <div className="text-xs text-gray-500 uppercase tracking-widest mb-1">Mexico kick-off · June 11</div>
              <div className="text-white font-bold text-base">1:00 PM CST</div>
              {autoFilled ? (
                <div className="mt-2 text-green-400 text-xs font-semibold">✓ Auto-fill has run — all picks complete</div>
              ) : isPast ? (
                <div className="mt-2 text-yellow-400 text-xs font-semibold">⚡ Deadline passed — auto-fill will trigger on next app load</div>
              ) : (
                <div className="mt-2 text-blue-400 text-sm font-mono font-bold">{formatCountdown(msLeft)}</div>
              )}
            </div>
          </div>

          <div>
            <h2 className="text-white font-black text-lg mb-1">Draft Order</h2>
            <p className="text-gray-500 text-xs mb-3">Snake format · 8 players · 6 rounds · 48 picks</p>
            <div className="bg-gray-900 rounded-xl divide-y divide-gray-800">
              {FIXED_PLAYERS.map((name, i) => (
                <div key={i} className="flex items-center gap-3 px-4 py-2.5">
                  <span className="text-gray-600 font-mono text-xs w-4">{i + 1}</span>
                  <span className="text-white font-semibold flex-1">{name}</span>
                  {i === FIXED_AI_IDX && (
                    <span className="text-xs bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded-full">AI</span>
                  )}
                </div>
              ))}
            </div>
          </div>

          <div>
            <h2 className="text-white font-black text-lg mb-1">Share Link</h2>
            <p className="text-gray-500 text-xs mb-3">Send this to all players — opens straight to the live draft.</p>
            <div className="bg-gray-900 rounded-xl px-4 py-3 font-mono text-xs text-green-400 break-all">{PAGES_URL}</div>
          </div>

        </div>
      );
    }

    // ─── APP ──────────────────────────────────────────────────────────────────

    function App() {
      const [state, setState]         = useState(DEFAULT_DRAFT_STATE);
      const [loading, setLoading]     = React.useState(true);
      const [fbError, setFbError]     = React.useState(null);
      const [activeTab, setActiveTab] = React.useState('leaderboard');
      const [passModal, setPassModal] = React.useState(null);

      // Connect to fixed Firebase room on mount; initialize if first run
      useEffect(() => {
        const ref = db.ref(`drafts/${FIXED_ROOM_ID}`);
        // Timeout fallback in case Firebase rules block the connection
        const timeout = setTimeout(() => {
          setFbError('Could not connect to Firebase. Check that Realtime Database rules allow read/write access.');
          setLoading(false);
        }, 8000);
        ref.on('value', snap => {
          clearTimeout(timeout);
          const data = snap.val();
          if (data) {
            // Firebase strips trailing nulls from arrays AND converts sparse arrays to objects.
            // Always rebuild the full 48-slot array regardless of what shape comes back.
            const normalizePicks = (raw) => {
              const arr = Array(48).fill(null);
              if (!raw) return arr;
              if (Array.isArray(raw)) {
                raw.forEach((v, i) => { if (i < 48) arr[i] = v || null; });
              } else {
                Object.entries(raw).forEach(([k, v]) => { arr[parseInt(k)] = v || null; });
              }
              return arr;
            };
            setState({ ...DEFAULT_DRAFT_STATE, ...data, picks: normalizePicks(data.picks) });
          } else {
            // A null snapshot is far more likely a transient read/rules issue than a
            // genuine first run. Never auto-write DEFAULT here — doing so would wipe an
            // existing draft and let auto-fill repopulate it by ranking. Show default
            // locally only; the real data reloads on the next successful read.
            setState(DEFAULT_DRAFT_STATE);
          }
          setLoading(false);
          setFbError(null);
        }, err => {
          clearTimeout(timeout);
          setFbError(`Firebase error: ${err.message}. Go to Firebase Console → Realtime Database → Rules and set both .read and .write to true.`);
          setLoading(false);
        });
        return () => { ref.off(); clearTimeout(timeout); };
      }, []);

      function writeState(newState) {
        setState(newState);
        db.ref(`drafts/${FIXED_ROOM_ID}`).set(newState);
      }

      // Keep a ref to latest state so deadline timer always reads fresh data
      const stateRef = React.useRef(state);
      React.useEffect(() => { stateRef.current = state; }, [state]);

      // Background auto-sync: pull ESPN scores every 5 min while the app is open.
      // Covers GitHub Actions cron delays/drops so scores stay current without a
      // manual click. Writes only the scores node — never touches picks.
      React.useEffect(() => {
        if (loading) return;
        let stopped = false;
        async function tick() {
          try {
            const { newScores } = await fetchESPNScores(stateRef.current.scores || {});
            if (!stopped) db.ref(`drafts/${FIXED_ROOM_ID}/scores`).set(newScores);
          } catch (e) { /* transient network/ESPN error — retry next tick */ }
        }
        const first = setTimeout(tick, 15000);           // shortly after load
        const iv    = setInterval(tick, 5 * 60 * 1000);  // every 5 minutes
        return () => { stopped = true; clearTimeout(first); clearInterval(iv); };
      }, [loading]);

      function performAutoFill(s) {
        if (s.autoFilled) return;
        const picks = [...s.picks];
        if (!picks.some(p => p === null)) return;
        const pickedSet = new Set(picks.filter(Boolean));
        const remaining = [...TEAMS]
          .filter(t => !pickedSet.has(t.id))
          .sort((a, b) => (a.rank || 999) - (b.rank || 999));
        let ri = 0;
        for (let i = 0; i < 48; i++) {
          if (picks[i] === null && ri < remaining.length) {
            picks[i] = remaining[ri++].id;
          }
        }
        writeState({ ...s, picks, autoFilled: true });
      }

      // If app is already open when deadline hits, fire auto-fill at that exact moment
      React.useEffect(() => {
        if (loading) return;
        const delay = DRAFT_DEADLINE.getTime() - Date.now();
        if (delay <= 0) return; // Already past — handled by the state-based effect below
        const timer = setTimeout(() => performAutoFill(stateRef.current), delay);
        return () => clearTimeout(timer);
      }, [loading]);

      // If app is opened after the deadline has already passed, auto-fill on load
      React.useEffect(() => {
        if (loading || state.autoFilled) return;
        if (Date.now() < DRAFT_DEADLINE.getTime()) return;
        if (!state.picks.some(p => p === null)) return;
        performAutoFill(state);
      }, [state.picks, state.autoFilled, loading]);

      // Claudinho AI auto-pick
      useEffect(() => {
        if (state.phase !== 'draft' || state.aiPlayerIdx === null) return;
        const currentPickIdx = state.picks.findIndex(p => p === null);
        if (currentPickIdx === -1) return;
        if (pickToPlayer(currentPickIdx, state.draftOrder) !== state.aiPlayerIdx) return;
        const timer = setTimeout(() => {
          const pickedSet = new Set(state.picks.filter(Boolean));
          const available = TEAMS.filter(t => !pickedSet.has(t.id));
          if (!available.length) return;
          const sorted = [...available].sort((a, b) => (TEAM_RATINGS[b.id] || 50) - (TEAM_RATINGS[a.id] || 50));
          const pool = sorted.slice(0, Math.min(3, sorted.length));
          const pick = pool[Math.floor(Math.random() * pool.length)];
          const idx = state.picks.findIndex(p => p === null);
          if (idx === -1) return;
          const picks = [...state.picks]; picks[idx] = pick.id;
          writeState({ ...state, picks });
        }, 1800);
        return () => clearTimeout(timer);
      }, [state.picks, state.phase, state.aiPlayerIdx, state.draftOrder]);

      function handlePick(teamId) {
        const idx = state.picks.findIndex(p => p === null);
        if (idx === -1) return;
        const picks = [...state.picks];
        picks[idx] = teamId;
        writeState({ ...state, picks });
        const pickerIdx = pickToPlayer(idx, state.draftOrder);
        if (pickerIdx !== state.aiPlayerIdx) {
          const team = TEAM_BY_ID[teamId];
          const nextPickIdx = idx + 1;
          const isDone = nextPickIdx >= 48;
          const nextPlayerIdx = isDone ? null : pickToPlayer(nextPickIdx, state.draftOrder);
          setPassModal({
            pickerName: state.players[pickerIdx],
            team,
            nextPlayerName: isDone ? null : state.players[nextPlayerIdx],
            isDone,
            pickNum: idx + 1,
          });
        }
      }

      function handleUndo() {
        const lastIdx = [...state.picks].map((p, i) => p ? i : -1).filter(i => i >= 0).slice(-1)[0];
        if (lastIdx === undefined || lastIdx < 0) return;
        const picks = [...state.picks];
        picks[lastIdx] = null;
        writeState({ ...state, picks });
      }

      function handleUpdateScore(teamId, data) {
        writeState({ ...state, scores: { ...state.scores, [teamId]: data } });
      }

      function handleBulkUpdateScores(newScores) {
        writeState({ ...state, scores: newScores });
      }

      function handleShare() {
        navigator.clipboard.writeText(PAGES_URL)
          .then(() => alert('Link copied! Send it to the WhatsApp group.'))
          .catch(() => prompt('Copy this link:', PAGES_URL));
      }

      function handleReset() {
        if (confirm('Reset the entire draft and all scores? This cannot be undone.')) {
          writeState(DEFAULT_DRAFT_STATE);
        }
      }

      if (loading) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center gap-4">
            <img src={LOGO_SRC} alt="Baja Boyz" className="w-24 opacity-60 select-none" style={{filter:'invert(1) brightness(0.7)'}} />
            <div className="text-green-600 text-xs tracking-widest animate-pulse">CONNECTING…</div>
          </div>
        );
      }

      if (fbError) {
        return (
          <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center gap-4 p-6">
            <img src={LOGO_SRC} alt="Baja Boyz" className="w-24 opacity-40 select-none" style={{filter:'invert(1) brightness(0.7)'}} />
            <div className="text-red-400 text-sm font-bold text-center">Connection Failed</div>
            <div className="text-gray-500 text-xs text-center max-w-xs">{fbError}</div>
            <button onClick={() => window.location.reload()} className="mt-2 text-xs bg-gray-800 text-gray-300 px-4 py-2 rounded-lg">Retry</button>
          </div>
        );
      }

      const tabs = [
        { id: 'leaderboard', emoji: '🏆', label: 'Ldrboard' },
        { id: 'groups',      emoji: '🗓', label: 'Groups' },
        { id: 'fixtures',    emoji: '⚽️', label: 'Fixtures' },
        { id: 'rosters',     emoji: '👥', label: 'Rosters' },
        { id: 'gallery',     emoji: '📸', label: 'Gallery' },
        { id: 'rankings',    emoji: '🌍', label: 'Rankings' },
        { id: 'settings',    emoji: '⚙️',  label: 'Settings' },
      ];

      const draftProgress = state.picks.filter(p => p !== null).length;

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-gray-900 border-b border-gray-800 sticky top-0 z-40">
            <div className="flex items-center justify-between px-4 py-2.5">
              <div className="flex items-center gap-2.5">
                <img src={LOGO_SRC} alt="Baja Boyz" className="h-9 select-none" style={{filter:'invert(1) brightness(0.85)'}} />
                <div>
                  <div className="baja-since text-gray-500" style={{fontSize:'9px',letterSpacing:'0.25em'}}>
                    WC 2026 · {draftProgress}/48 picks
                    {draftProgress > 0 && draftProgress < 48 && (
                      <span> · {state.players[pickToPlayer(draftProgress, state.draftOrder)]} on clock</span>
                    )}
                  </div>
                  <div style={{fontSize:'8px',letterSpacing:'0.15em'}} className="text-green-600 font-mono">
                    ● LIVE
                  </div>
                </div>
              </div>
              <button
                onClick={handleShare}
                className="text-xs bg-green-700 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg transition-colors font-medium"
              >
                Share
              </button>
            </div>

            <nav className="flex">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 py-2 flex flex-col items-center gap-0.5 font-semibold transition-colors border-b-2 ${
                    activeTab === tab.id
                      ? 'text-green-400 border-green-400'
                      : 'text-gray-500 border-transparent hover:text-gray-300'
                  }`}
                >
                  <span className="text-base leading-none">{tab.emoji}</span>
                  <span style={{fontSize:'9px'}}>{tab.label}</span>
                </button>
              ))}
            </nav>
          </header>

          {passModal && <PassModal info={passModal} roomId={FIXED_ROOM_ID} onClose={() => setPassModal(null)} />}

          <main className="flex-1 overflow-auto">
            {activeTab === 'draft'       && <DraftScreen       state={state} onPick={handlePick} onUndo={handleUndo} onShare={setPassModal} />}
            {activeTab === 'fixtures'    && <FixturesScreen    state={state} />}
            {activeTab === 'rosters'     && <RostersScreen     state={state} />}
            {activeTab === 'groups'      && <GroupsScreen      state={state} />}
            {activeTab === 'rankings'    && <RankingsScreen    state={state} />}
            {activeTab === 'gallery'     && <GalleryScreen     />}
            {activeTab === 'scoring'     && <ScoringScreen     state={state} onUpdateScore={handleUpdateScore} onBulkUpdate={handleBulkUpdateScores} />}
            {activeTab === 'leaderboard' && <LeaderboardScreen state={state} />}
            {activeTab === 'settings'    && <SettingsScreen    autoFilled={!!state.autoFilled} scores={state.scores} onBulkUpdate={handleBulkUpdateScores} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
